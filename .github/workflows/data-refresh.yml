name: Data Refresh
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --prefix src/scripts/node
          pip install -r src/scripts/py/requirements.txt
      # Timetable first: the RateMyProfessors import matches reviews against the stored courses.
      - name: Refresh the timetable and course details
        run: node src/scripts/node/refresh.js dal
      - name: Import RateMyProfessors professors and reviews
        run: python3 src/scripts/py/rmp_reviews.py --university dal
      # Pages are cached for a day; this shows the new data straight away. Skipped until the
      # REVALIDATE_SECRET and SITE_URL secrets are set.
      - name: Refresh the site
        if: ${{ always() }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "REVALIDATE_SECRET or SITE_URL isn't set; pages refresh within a day"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SITE_URL/api/revalidate" -H "Authorization: Bearer $REVALIDATE_SECRET"
