<!doctype html>
<html lang="en" class="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>{{TITLE}} · DalSearch</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0C0E;
    --panel: #141416;
    --raised: #1C1C1F;
    --block: #222226;
    --line: rgba(255, 255, 255, 0.07);
    --line-2: rgba(255, 255, 255, 0.12);
    --text: #F4F4F5;
    --text-2: #A6A6AD;
    --text-3: #6E6E76;
    --body: #CDCDD2;
    --accent: #FFD21F;
    --accent-ink: #17150D;
    --green: #3DD68C;
    --red: #F25F5C;

    --c-2110: #5C8FF0;
    --c-2141: #9D80EC;
    --c-2060: #3FBF8C;
    --c-1101: #EF7B5C;
  }
  .light {
    --bg: #F3F3F5;
    --panel: #FFFFFF;
    --raised: #F3F3F5;
    --block: #EEEEF1;
    --line: rgba(0, 0, 0, 0.08);
    --line-2: rgba(0, 0, 0, 0.14);
    --text: #121214;
    --text-2: #5C5C64;
    --text-3: #92929A;
    --body: #3A3A40;
    --green: #16A365;
    --red: #DC3B3B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Satoshi", ui-sans-serif, system-ui, sans-serif;
    color: var(--text); font-size: 14px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  svg.i.sm { width: 15px; height: 15px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 16px 12px 12px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px; }
  .brand svg { width: 24px; height: 24px; }
  .brand span { font-size: 17px; font-weight: 900; letter-spacing: -0.02em; }
  .search {
    margin: 16px 0 10px; height: 38px; border-radius: 999px; border: 1px solid var(--line-2);
    display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text-3); font-size: 14px; font-weight: 500;
  }
  .search kbd { margin-left: auto; font: inherit; font-size: 12px; color: var(--text-3); }
  .nav a { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 14.5px; font-weight: 500; color: var(--text-2); }
  .nav a.on { background: var(--raised); color: var(--text); font-weight: 700; }
  .light .nav a.on { background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
  .grp { display: flex; align-items: center; justify-content: space-between; margin: 22px 14px 6px; font-size: 13px; font-weight: 700; color: var(--text-3); }
  .grp span { font-weight: 500; }
  .crs { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; }
  .crs .sw { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .crs b { font-weight: 700; flex-shrink: 0; }
  .crs span { color: var(--text-3); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crs .warn { margin-left: auto; color: var(--red); }
  .side .user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-size: 12px; font-weight: 700; }
  .user .name { font-size: 14px; font-weight: 700; }
  .user .sub { font-size: 12.5px; color: var(--text-3); font-weight: 500; }

  /* ---------- Main ---------- */
  .main { margin: 10px 10px 10px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 26px; min-width: 0; }
  .crumbs { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 500; color: var(--text-3); }
  .crumbs b { color: var(--text-2); font-weight: 700; }
  .crumbs .tools { margin-left: auto; display: flex; gap: 2px; color: var(--text-3); }
  .crumbs .tools button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; }

  .wrap { padding: 0 40px 32px; }
  .head { padding-top: 36px; }
  .actions { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  .actions .hint { font-size: 14px; color: var(--text-2); font-weight: 500; }
  .actions .icons { margin-left: auto; display: flex; gap: 4px; color: var(--text-2); }
  .actions .icons button { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
  .actions .icons svg { width: 23px; height: 23px; }
  .code { font-size: 46px; line-height: 1; font-weight: 900; letter-spacing: -0.035em; }
  .title { font-size: 23px; font-weight: 500; color: var(--body); margin-top: 8px; letter-spacing: -0.01em; }
  .cta { display: flex; align-items: center; gap: 14px; }
  .cta .hint { font-size: 13.5px; color: var(--text-2); font-weight: 500; text-align: right; line-height: 1.35; }
  .cta .hint b { color: var(--text); font-weight: 700; }
  .primary { height: 48px; padding: 0 26px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ghost { width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--text-2); }

  .tabs { display: flex; gap: 28px; margin-top: 30px; border-bottom: 1px solid var(--line); }
  .tab { position: relative; padding: 0 0 13px; font-size: 15px; font-weight: 700; color: var(--text-3); }
  .tab span { font-weight: 500; margin-left: 4px; }
  .tab-overview .tab[data-t=overview], .tab-schedule .tab[data-t=schedule], .tab-reviews .tab[data-t=reviews] { color: var(--text); }
  .tab-overview .tab[data-t=overview]::after, .tab-schedule .tab[data-t=schedule]::after, .tab-reviews .tab[data-t=reviews]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1.5px; height: 3px; background: var(--text); border-radius: 999px;
  }
  .pane { display: none; }
  .tab-overview .pane[data-t=overview], .tab-schedule .pane[data-t=schedule], .tab-reviews .pane[data-t=reviews] { display: block; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; padding-top: 32px; }

  h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .row-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .desc { font-size: 15.5px; line-height: 1.65; color: var(--body); font-weight: 500; max-width: 640px; }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--raised); }
  .seg span { height: 30px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .seg span.on { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line-2); }
  .seg span.off { color: var(--text-3); text-decoration: line-through; font-weight: 500; }

  .table { margin-top: 14px; }
  .tr { display: grid; grid-template-columns: 32px minmax(0, 1.1fr) 96px 112px minmax(0, 1fr) 64px; align-items: center; column-gap: 12px; padding: 0 18px; }
  .th { height: 34px; font-size: 13px; font-weight: 500; color: var(--text-3); border-bottom: 1px solid var(--line); }
  .grp-row { font-size: 13px; font-weight: 700; color: var(--text-3); padding: 16px 18px 4px; }
  .r { height: 58px; border-radius: 20px; font-size: 14.5px; font-weight: 500; color: var(--text-2); }
  .r.sel { background: var(--raised); color: var(--text); }
  .r .s1 { font-size: 14.5px; font-weight: 700; color: var(--text); }
  .r .s2 { font-size: 12.5px; color: var(--text-3); margin-top: 1px; }
  .r .right { text-align: right; }
  .pick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--text-3); }
  .pick.on { border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .pick.on svg { width: 12px; height: 12px; }
  .note { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 0 18px; font-size: 14px; font-weight: 500; color: var(--text-2); }
  .note svg { color: var(--green); }
  .note a { color: var(--text); font-weight: 700; margin-left: 4px; text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }

  .block-gap { margin-top: 44px; }
  .scores { display: flex; align-items: baseline; gap: 36px; margin-top: 16px; }
  .score b { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; }
  .score span { margin-left: 8px; font-size: 14px; color: var(--text-2); font-weight: 500; }
  .quote { margin-top: 18px; padding: 18px 22px; border-radius: 24px; background: var(--raised); max-width: 680px; }
  .quote p { font-size: 15px; line-height: 1.55; color: var(--body); font-weight: 500; }
  .quote div { margin-top: 8px; font-size: 13px; color: var(--text-3); font-weight: 500; }
  .link { font-size: 14px; font-weight: 700; color: var(--text-2); }

  /* ---------- Calendar ---------- */
  .legend { display: flex; gap: 16px; font-size: 13px; font-weight: 500; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .cal { --ppm: 0.9333px; display: grid; grid-template-columns: 44px repeat(5, 1fr); margin-top: 18px; }
  .cal .dh { height: 30px; font-size: 13px; font-weight: 700; color: var(--text-2); padding-left: 8px; }
  .cal .dh span { font-weight: 500; color: var(--text-3); margin-left: 4px; }
  .hours { position: relative; height: calc(600 * var(--ppm)); }
  .hours span { position: absolute; right: 10px; transform: translateY(-50%); font-size: 12px; color: var(--text-3); font-weight: 500; }
  .day { position: relative; height: calc(600 * var(--ppm)); border-left: 1px solid var(--line);
    background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% calc(60 * var(--ppm)); }
  .ev { position: absolute; left: 4px; right: 4px; top: calc(var(--s) * var(--ppm) + 1px); height: calc((var(--e) - var(--s)) * var(--ppm) - 2px);
    border-radius: 12px; background: var(--block); padding: 6px 10px; font-size: 12px; line-height: 1.3; color: var(--text-2); overflow: hidden; }
  .ev b { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); font-weight: 700; }
  .ev b i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .ev.me { background: var(--accent); color: rgba(23, 21, 13, 0.75); }
  .ev.me b { color: var(--accent-ink); }
  .ev.alt { background: transparent; border: 1.5px dashed var(--text-3); color: var(--text-2); }
  .ev.alt b { color: var(--text); }
  .ev.clash { outline: 1.5px solid var(--red); outline-offset: -1.5px; }
  .ev.half-l { right: calc(50% + 2px); }
  .ev.half-r { left: calc(50% + 2px); }
  .facts { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 40px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .fact b { display: block; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
  .fact span { display: block; margin-top: 3px; font-size: 13.5px; color: var(--text-2); font-weight: 500; }
  .sub-note { margin-top: 18px; font-size: 13.5px; color: var(--text-3); font-weight: 500; }

  /* ---------- Reviews ---------- */
  .composer { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding: 8px 8px 8px 10px; border: 1px solid var(--line-2); border-radius: 999px; }
  .composer .ph { flex: 1; font-size: 14.5px; color: var(--text-3); font-weight: 500; }
  .btn2 { height: 38px; padding: 0 18px; border-radius: 999px; background: var(--raised); font-size: 13.5px; font-weight: 700; color: var(--text); }
  .msgs { margin-top: 8px; }
  .msg { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .msg .avatar { width: 34px; height: 34px; background: var(--raised); color: var(--text-3); }
  .msg .avatar svg { width: 18px; height: 18px; fill: currentColor; }
  .who { display: flex; align-items: baseline; gap: 10px; }
  .who b { font-size: 14.5px; font-weight: 700; }
  .who span { font-size: 13px; color: var(--text-3); font-weight: 500; }
  .msg p { margin-top: 5px; font-size: 15px; line-height: 1.55; color: var(--body); font-weight: 500; max-width: 660px; }
  .msg .foot { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--text-3); font-weight: 500; }
  .msg .foot b { color: var(--text-2); font-weight: 700; }
  .msg .foot .helpful { margin-left: auto; }

  /* ---------- Properties ---------- */
  .props { border-left: 1px solid var(--line); padding-left: 28px; align-self: start; }
  .prop { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: start; padding: 6px 0; font-size: 14px; font-weight: 500; }
  .prop dt { color: var(--text-3); }
  .prop dd { color: var(--text); line-height: 1.55; }
  .prop dd a { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
  .prop dd .dim { color: var(--text-3); }
  .props hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .props h3 { font-size: 13px; font-weight: 700; color: var(--text-3); margin-bottom: 12px; }
  .prof { display: flex; gap: 11px; }
  .prof + .prof { margin-top: 14px; }
  .prof .avatar { background: var(--raised); color: var(--text-2); }
  .prof b { display: block; font-size: 14.5px; font-weight: 700; }
  .prof span { display: block; font-size: 13px; color: var(--text-2); font-weight: 500; margin-top: 1px; }
  .prof em { font-style: normal; color: var(--text); font-weight: 700; }
  .ext { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--text-2); }
  .footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-3); font-weight: 500; }

  /* ---------- Explore ---------- */
  .lede { font-size: 16px; color: var(--text-2); font-weight: 500; margin-top: 10px; }
  .bigsearch {
    display: flex; align-items: center; gap: 12px; height: 54px; margin-top: 28px; padding: 0 10px 0 22px;
    border-radius: 999px; border: 1px solid var(--line-2); font-size: 16px; font-weight: 500; color: var(--text-3);
  }
  .bigsearch > svg { width: 20px; height: 20px; color: var(--text-2); }
  .bigsearch kbd { margin-left: auto; font: inherit; font-size: 13px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 11px; }
  .filters { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .fpill {
    height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2);
    display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--text);
  }
  .fpill.set { background: var(--raised); border-color: transparent; padding-right: 10px; }
  .fpill svg { width: 14px; height: 14px; color: var(--text-3); }
  .fpill .lbl { color: var(--text-3); font-weight: 500; }
  .toggle { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text-2); }
  .switch { width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); }
  .light .switch::after { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }

  .results-head { display: flex; align-items: center; gap: 18px; margin-top: 38px; }
  .fitcount { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); font-weight: 500; }
  .fitcount i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .sort { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-3); font-weight: 500; }
  .sort b { color: var(--text); font-weight: 700; }

  .list { margin-top: 12px; }
  .lr { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.25fr) minmax(0, 1.45fr) 76px minmax(0, 1.6fr) 36px; align-items: center; column-gap: 18px; padding: 0 18px; }
  .lh { height: 36px; font-size: 13px; color: var(--text-3); font-weight: 500; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .li { height: 64px; border-radius: 20px; font-size: 14px; color: var(--text-2); font-weight: 500; }
  .li.hover { background: var(--raised); }
  .li .c1 { font-size: 14.5px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .li .c2 { font-size: 13px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .c3 { font-size: 13px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .plain { color: var(--text); }
  .st { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .st i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .st.fit i { background: var(--green); }
  .st.clash { color: var(--red); }
  .st.clash i { background: var(--red); }
  .li .c3.ind { padding-left: 16px; }
  .full { color: var(--red); font-weight: 700; }
  .save { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); }
  .save svg { width: 20px; height: 20px; }
  .li .save { visibility: hidden; }
  .li.hover .save { visibility: visible; color: var(--text-2); }
  .more { display: flex; justify-content: center; margin-top: 18px; }

  /* ---------- Schedule page ---------- */
  .term-title { display: flex; align-items: center; gap: 14px; }
  .term-title button { width: 38px; height: 38px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; color: var(--text-2); }
  .outline { height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .tab.on { color: var(--text); }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1.5px; height: 3px; background: var(--text); border-radius: 999px; }

  .clashbar {
    display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 16px; border-radius: 999px;
    background: var(--raised); font-size: 14px; font-weight: 500; color: var(--text-2);
  }
  .clashbar > svg { color: var(--red); }
  .clashbar b { color: var(--text); font-weight: 700; }
  .clashbar .btn2 { margin-left: auto; background: var(--panel); box-shadow: 0 0 0 1px var(--line-2); }

  .page-schedule .cal { --ppm: 1.02px; margin-top: 22px; }
  .page-schedule .ev { padding: 7px 10px; }
  .ev.c { background: color-mix(in srgb, var(--c) 22%, var(--panel)); color: var(--text-2); }
  .light .ev.c { background: color-mix(in srgb, var(--c) 17%, #fff); }
  .ev.c b { color: var(--text); }
  .ev .room { color: var(--text-3); }

  .sc { display: grid; grid-template-columns: 10px 1fr; gap: 12px; padding: 9px 0; }
  .sc > i { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; }
  .sc1 { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 700; }
  .sc1 span { font-weight: 500; color: var(--text-3); font-size: 13.5px; }
  .sc2 { font-size: 13.5px; color: var(--text-2); font-weight: 500; margin-top: 1px; }
  .sc3 { font-size: 13px; color: var(--text-3); font-weight: 500; margin-top: 2px; }
  .sc3.warn { color: var(--red); }
  .wide { width: 100%; justify-content: center; margin-top: 12px; display: flex; align-items: center; gap: 8px; height: 40px; }
  .exam { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; font-weight: 500; }
  .exam b { font-weight: 700; }
  .exam span { color: var(--text-2); }

{{EXTRA_CSS}}
</style>
</head>
